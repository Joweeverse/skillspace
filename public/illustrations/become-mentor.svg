<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="mentor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="mentor-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#mentor-bg)"/>

  <!-- Background glow circles -->
  <circle cx="150" cy="200" r="140" fill="#2563EB" opacity="0.08"/>
  <circle cx="480" cy="300" r="100" fill="#3B82F6" opacity="0.06"/>

  <!-- Mentor Figure (Center-Left) -->
  <!-- Body -->
  <path d="M 120 450 C 120 360, 155 320, 195 310 C 215 305, 240 305, 260 310 C 300 320, 335 360, 335 450 Z" fill="#1E40AF"/>
  <!-- Collar -->
  <polygon points="215,310 228,355 242,310" fill="#FFFFFF" opacity="0.9"/>
  <!-- Head -->
  <circle cx="228" cy="258" r="48" fill="#FBA585"/>
  <!-- Hair -->
  <path d="M 180 248 C 180 196, 276 196, 276 248 C 266 215, 190 215, 180 248 Z" fill="#292524"/>
  <path d="M 180 240 Q 196 206 230 210 Q 268 218 278 250 C 264 224, 196 220, 180 240 Z" fill="#1C1917"/>
  <!-- Glasses -->
  <rect x="198" y="248" width="26" height="18" rx="5" fill="none" stroke="#0F172A" stroke-width="3"/>
  <rect x="232" y="248" width="26" height="18" rx="5" fill="none" stroke="#0F172A" stroke-width="3"/>
  <line x1="224" y1="257" x2="232" y2="257" stroke="#0F172A" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="209" cy="257" r="3.5" fill="#0F172A"/>
  <circle cx="243" cy="257" r="3.5" fill="#0F172A"/>
  <!-- Smile -->
  <path d="M 212 278 Q 228 290 244 278" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mentor Right Arm pointing toward right (CTA side) -->
  <path d="M 290 345 Q 360 310 410 300" stroke="#1E40AF" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M 290 345 Q 360 310 410 300" stroke="#FBA585" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Pointing hand -->
  <circle cx="420" cy="298" r="13" fill="#FBA585"/>
  <path d="M 420 298 L 452 292" stroke="#FBA585" stroke-width="9" stroke-linecap="round"/>

  <!-- Floating board / screen the mentor holds -->
  <g transform="translate(360, 90)" filter="url(#mentor-shadow)">
    <rect width="200" height="260" rx="16" fill="#FFFFFF"/>
    <!-- Screen top bar -->
    <rect width="200" height="40" rx="16" fill="url(#blue-grad)"/>
    <rect y="24" width="200" height="16" fill="#1D4ED8"/>
    <text x="100" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">My Course</text>

    <!-- Course stats inside board -->
    <text x="20" y="66" font-family="sans-serif" font-size="11" fill="#64748B">Students enrolled</text>
    <text x="20" y="85" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A">128</text>

    <line x1="20" y1="100" x2="180" y2="100" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#64748B">Avg. Rating</text>
    <!-- Star rating -->
    <text x="20" y="145" font-family="sans-serif" font-size="14" fill="#F59E0B">★★★★★</text>
    <text x="122" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">4.9</text>

    <line x1="20" y1="162" x2="180" y2="162" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="20" y="184" font-family="sans-serif" font-size="11" fill="#64748B">Revenue this month</text>
    <text x="20" y="206" font-family="sans-serif" font-size="20" font-weight="bold" fill="#10B981">+\$1,240</text>

    <!-- CTA button on board -->
    <rect x="20" y="224" width="160" height="30" rx="10" fill="url(#blue-grad)"/>
    <text x="100" y="243" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Publish Lesson →</text>
  </g>

  <!-- Sparkle accents -->
  <circle cx="90" cy="130" r="5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="340" cy="420" r="7" fill="#60A5FA" opacity="0.4"/>
  <circle cx="540" cy="80" r="4" fill="#93C5FD" opacity="0.5"/>
  <path d="M 310 70 L 316 60 L 322 70 L 316 80 Z" fill="#F59E0B" opacity="0.7"/>
</svg>
