<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="150" r="120" fill="#EFF6FF" opacity="0.6"/>

  <!-- Open empty book -->
  <rect x="80" y="130" width="100" height="110" rx="8" fill="#DBEAFE" transform="rotate(-8 80 130)"/>
  <rect x="80" y="130" width="100" height="110" rx="8" fill="white" stroke="#BFDBFE" stroke-width="2" transform="rotate(-8 80 130)"/>
  <line x1="82" y1="145" x2="168" y2="135" stroke="#DBEAFE" stroke-width="2"/>
  <line x1="84" y1="158" x2="170" y2="148" stroke="#DBEAFE" stroke-width="2"/>
  <line x1="86" y1="171" x2="172" y2="161" stroke="#DBEAFE" stroke-width="2"/>

  <rect x="220" y="130" width="100" height="110" rx="8" fill="#DBEAFE" transform="rotate(8 220 130)"/>
  <rect x="220" y="130" width="100" height="110" rx="8" fill="white" stroke="#BFDBFE" stroke-width="2" transform="rotate(8 220 130)"/>
  <line x1="232" y1="145" x2="318" y2="155" stroke="#DBEAFE" stroke-width="2"/>
  <line x1="234" y1="158" x2="320" y2="168" stroke="#DBEAFE" stroke-width="2"/>
  <line x1="236" y1="171" x2="322" y2="181" stroke="#DBEAFE" stroke-width="2"/>

  <!-- Book spine -->
  <rect x="192" y="128" width="16" height="114" rx="4" fill="#2563EB" transform=""/>

  <!-- Magnifying glass -->
  <circle cx="260" cy="90" r="30" fill="none" stroke="#93C5FD" stroke-width="6"/>
  <circle cx="260" cy="90" r="22" fill="#EFF6FF"/>
  <line x1="282" y1="112" x2="300" y2="130" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>
  <!-- Question mark inside glass -->
  <text x="260" y="98" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563EB">?</text>

  <!-- Dashed circle around book (empty state indicator) -->
  <circle cx="200" cy="185" r="82" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

  <!-- Stars -->
  <text x="136" y="92" font-size="14" fill="#93C5FD">✦</text>
  <text x="318" y="200" font-size="10" fill="#BFDBFE">✦</text>
  <text x="100" y="230" font-size="12" fill="#DBEAFE">✦</text>
</svg>
