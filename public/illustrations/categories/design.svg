<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FDF4FF"/>
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EC4899" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>

  <!-- Background blobs -->
  <circle cx="520" cy="80" r="110" fill="#F5F3FF" opacity="0.6"/>
  <circle cx="80" cy="380" r="90" fill="#FDF4FF" opacity="0.5"/>
  <ellipse cx="300" cy="430" rx="150" ry="40" fill="#EDE9FE" opacity="0.4"/>

  <!-- === CANVAS / ARTBOARD === -->
  <g filter="url(#shadow1)">
    <rect x="140" y="80" width="300" height="260" rx="12" fill="white" stroke="#E9D5FF" stroke-width="2"/>
    <!-- Canvas frame top -->
    <rect x="140" y="80" width="300" height="30" rx="12" fill="#8B5CF6" opacity="0.1"/>
    <rect x="140" y="98" width="300" height="12" fill="#8B5CF6" opacity="0.1"/>
    <!-- Frame dots -->
    <circle cx="162" cy="95" r="6" fill="#EC4899" opacity="0.7"/>
    <circle cx="180" cy="95" r="6" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="198" cy="95" r="6" fill="#10B981" opacity="0.7"/>
    <!-- Title bar text -->
    <rect x="215" y="90" width="80" height="8" rx="4" fill="#C4B5FD" opacity="0.5"/>

    <!-- Canvas content: abstract design mockup -->
    <!-- Big colored shape -->
    <rect x="160" y="125" width="130" height="90" rx="10" fill="#8B5CF6" opacity="0.15"/>
    <rect x="162" y="127" width="126" height="86" rx="9" fill="#EDE9FE"/>
    <!-- Design elements inside canvas -->
    <circle cx="220" cy="168" rx="30" ry="30" r="30" fill="#8B5CF6" opacity="0.3"/>
    <circle cx="250" cy="175" r="20" fill="#EC4899" opacity="0.4"/>
    <!-- Bezier / curve line -->
    <path d="M 170 210 Q 220 180 270 210" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Right side: typography mockup -->
    <rect x="305" y="128" width="120" height="10" rx="5" fill="#8B5CF6" opacity="0.4"/>
    <rect x="305" y="144" width="90" height="6" rx="3" fill="#C4B5FD" opacity="0.5"/>
    <rect x="305" y="156" width="110" height="6" rx="3" fill="#C4B5FD" opacity="0.4"/>
    <rect x="305" y="168" width="70" height="6" rx="3" fill="#C4B5FD" opacity="0.3"/>

    <!-- Color swatches row -->
    <rect x="305" y="185" width="20" height="20" rx="5" fill="#8B5CF6"/>
    <rect x="330" y="185" width="20" height="20" rx="5" fill="#EC4899"/>
    <rect x="355" y="185" width="20" height="20" rx="5" fill="#3B82F6"/>
    <rect x="380" y="185" width="20" height="20" rx="5" fill="#10B981"/>
    <rect x="405" y="185" width="20" height="20" rx="5" fill="#FBBF24"/>

    <!-- Bottom row: grid of shapes -->
    <rect x="160" y="230" width="260" height="90" rx="8" fill="#F5F3FF"/>
    <rect x="170" y="240" width="55" height="70" rx="8" fill="#EDE9FE"/>
    <circle cx="260" cy="275" r="30" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
    <polygon points="340,245 375,308 305,308" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="385" y="250" width="25" height="25" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" transform="rotate(20,397,262)"/>
  </g>

  <!-- === COLOR PALETTE TOOL === -->
  <g filter="url(#shadow2)" transform="translate(70, 130)">
    <!-- Palette shape -->
    <path d="M 60 10 Q 90 0 110 20 Q 130 40 120 70 Q 110 100 80 100 Q 60 110 50 95 Q 25 100 20 80 Q 10 60 20 40 Q 30 15 60 10 Z" fill="white" stroke="#E9D5FF" stroke-width="2"/>
    <!-- Palette hole -->
    <circle cx="75" cy="88" r="12" fill="#F5F3FF"/>
    <!-- Color blobs on palette -->
    <circle cx="45" cy="45" r="12" fill="#EC4899"/>
    <circle cx="75" cy="30" r="12" fill="#8B5CF6"/>
    <circle cx="105" cy="45" r="12" fill="#3B82F6"/>
    <circle cx="108" cy="75" r="12" fill="#10B981"/>
    <circle cx="45" cy="78" r="10" fill="#FBBF24"/>
  </g>

  <!-- === PEN TOOL === -->
  <g transform="translate(460, 100)">
    <!-- Pen body -->
    <rect x="30" y="0" width="18" height="90" rx="9" fill="url(#penGrad)"/>
    <!-- Pen grip -->
    <rect x="30" y="60" width="18" height="20" rx="5" fill="#6D28D9"/>
    <!-- Pen nib -->
    <path d="M 30 90 L 39 115 L 48 90 Z" fill="#4C1D95"/>
    <!-- Pen clip -->
    <rect x="46" y="5" width="5" height="50" rx="2.5" fill="#A78BFA"/>
    <!-- Pen top button -->
    <rect x="30" y="0" width="18" height="12" rx="6" fill="#A78BFA"/>
    <!-- Bezier anchor points -->
    <circle cx="-10" cy="140" r="6" fill="#EC4899" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="150" r="6" fill="#8B5CF6" stroke="white" stroke-width="2"/>
    <circle cx="70" cy="130" r="6" fill="#EC4899" stroke="white" stroke-width="2"/>
    <path d="M -10 140 Q 30 110 70 130" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <!-- Control handles -->
    <line x1="-10" y1="140" x2="10" y2="125" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="10" cy="125" r="3" fill="#C4B5FD"/>
    <line x1="70" y1="130" x2="52" y2="118" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="52" cy="118" r="3" fill="#C4B5FD"/>
  </g>

  <!-- Floating color circles (like color picker dots) -->
  <circle cx="120" cy="310" r="22" fill="#EC4899" opacity="0.8"/>
  <circle cx="120" cy="310" r="14" fill="#F9A8D4"/>
  <circle cx="460" cy="320" r="20" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="460" cy="320" r="12" fill="#C4B5FD"/>
  <circle cx="80" cy="200" r="16" fill="#3B82F6" opacity="0.5"/>
  <circle cx="510" cy="200" r="14" fill="#FBBF24" opacity="0.6"/>

  <!-- Sparkles -->
  <text x="490" y="80" font-size="24" fill="#EC4899" opacity="0.8">✦</text>
  <text x="460" y="60" font-size="14" fill="#8B5CF6" opacity="0.6">✦</text>
  <text x="90" y="80" font-size="18" fill="#A78BFA" opacity="0.7">★</text>
  <text x="120" y="60" font-size="12" fill="#EC4899" opacity="0.5">✦</text>

  <!-- Label -->
  <rect x="195" y="368" width="210" height="38" rx="19" fill="url(#paletteGrad)" opacity="0.9"/>
  <text x="300" y="392" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Design &amp; Creativity</text>
</svg>
