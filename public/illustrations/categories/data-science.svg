<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="ds-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="ds-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="ds-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.14"/>
    </filter>
    <filter id="ds-shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="url(#ds-bg)"/>
  <circle cx="540" cy="100" r="80" fill="#99F6E4" opacity="0.4"/>
  <circle cx="60" cy="360" r="60" fill="#5EEAD4" opacity="0.25"/>

  <!-- Main dashboard card -->
  <g transform="translate(40, 35)" filter="url(#ds-shadow)">
    <rect width="520" height="260" rx="20" fill="#FFFFFF"/>

    <!-- Header bar -->
    <rect width="520" height="44" rx="20" fill="url(#ds-teal)"/>
    <rect y="24" width="520" height="20" fill="#0D9488"/>
    <text x="20" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Data Analytics Dashboard</text>
    <circle cx="488" cy="22" r="10" fill="#14B8A6"/>
    <text x="488" y="26" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LIVE</text>

    <!-- Bar chart -->
    <text x="20" y="72" font-family="sans-serif" font-size="10" fill="#94A3B8" font-weight="600">Model Accuracy by Dataset</text>
    <!-- Bars -->
    <rect x="20"  y="140" width="30" height="96" rx="6" fill="#CCFBF1"/>
    <rect x="20"  y="92"  width="30" height="48" rx="6" fill="url(#ds-teal)"/>

    <rect x="68"  y="130" width="30" height="106" rx="6" fill="#CCFBF1"/>
    <rect x="68"  y="85"  width="30" height="45"  rx="6" fill="url(#ds-teal)"/>

    <rect x="116" y="120" width="30" height="116" rx="6" fill="#CCFBF1"/>
    <rect x="116" y="78"  width="30" height="42"  rx="6" fill="url(#ds-teal)"/>

    <rect x="164" y="110" width="30" height="126" rx="6" fill="#CCFBF1"/>
    <rect x="164" y="68"  width="30" height="42"  rx="6" fill="#14B8A6"/>

    <rect x="212" y="100" width="30" height="136" rx="6" fill="#CCFBF1"/>
    <rect x="212" y="60"  width="30" height="40"  rx="6" fill="#0D9488"/>

    <rect x="260" y="90"  width="30" height="146" rx="6" fill="#CCFBF1"/>
    <rect x="260" y="50"  width="30" height="40"  rx="6" fill="#0D9488"/>

    <!-- Accuracy % labels -->
    <text x="35"  y="88"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">78%</text>
    <text x="83"  y="81"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">82%</text>
    <text x="131" y="74"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">85%</text>
    <text x="179" y="64"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">89%</text>
    <text x="227" y="56"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">92%</text>
    <text x="275" y="46"  font-family="sans-serif" font-size="9" fill="#0D9488" text-anchor="middle" font-weight="bold">95%</text>

    <!-- Neural network diagram (right side) -->
    <text x="320" y="72" font-family="sans-serif" font-size="10" fill="#94A3B8" font-weight="600">Neural Network</text>
    <!-- Input layer nodes -->
    <circle cx="340" cy="100" r="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="340" cy="130" r="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="340" cy="160" r="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="340" cy="190" r="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <!-- Hidden layer 1 -->
    <circle cx="400" cy="110" r="12" fill="url(#ds-teal)" opacity="0.8"/>
    <circle cx="400" cy="145" r="12" fill="url(#ds-teal)" opacity="0.8"/>
    <circle cx="400" cy="180" r="12" fill="url(#ds-teal)" opacity="0.8"/>
    <!-- Hidden layer 2 -->
    <circle cx="460" cy="120" r="12" fill="#0D9488"/>
    <circle cx="460" cy="160" r="12" fill="#0D9488"/>
    <!-- Output -->
    <circle cx="510" cy="140" r="14" fill="url(#ds-blue)"/>
    <text x="510" y="145" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">AI</text>
    <!-- Connections (sample) -->
    <line x1="350" y1="100" x2="388" y2="110" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="100" x2="388" y2="145" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="130" x2="388" y2="110" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="130" x2="388" y2="145" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="160" x2="388" y2="145" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="160" x2="388" y2="180" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="350" y1="190" x2="388" y2="180" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="412" y1="110" x2="448" y2="120" stroke="#5EEAD4" stroke-width="1.5"/>
    <line x1="412" y1="110" x2="448" y2="160" stroke="#5EEAD4" stroke-width="1.5"/>
    <line x1="412" y1="145" x2="448" y2="120" stroke="#5EEAD4" stroke-width="1.5"/>
    <line x1="412" y1="145" x2="448" y2="160" stroke="#5EEAD4" stroke-width="1.5"/>
    <line x1="412" y1="180" x2="448" y2="160" stroke="#5EEAD4" stroke-width="1.5"/>
    <line x1="472" y1="120" x2="496" y2="140" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="472" y1="160" x2="496" y2="140" stroke="#2DD4BF" stroke-width="2"/>
  </g>

  <!-- Stat chips row -->
  <g transform="translate(40, 320)">
    <!-- Chip 1 -->
    <g filter="url(#ds-shadow-sm)">
      <rect width="150" height="90" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="sans-serif" font-size="10" fill="#94A3B8" font-weight="600">Training Data</text>
      <text x="20" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0D9488">1.2M</text>
      <text x="20" y="76" font-family="sans-serif" font-size="10" fill="#14B8A6">rows processed</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(170, 0)" filter="url(#ds-shadow-sm)">
      <rect width="150" height="90" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="sans-serif" font-size="10" fill="#94A3B8" font-weight="600">Precision</text>
      <text x="20" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2563EB">94.8%</text>
      <text x="20" y="76" font-family="sans-serif" font-size="10" fill="#3B82F6">model score</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(340, 0)" filter="url(#ds-shadow-sm)">
      <rect width="150" height="90" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="sans-serif" font-size="10" fill="#94A3B8" font-weight="600">Features</text>
      <text x="20" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0D9488">247</text>
      <text x="20" y="76" font-family="sans-serif" font-size="10" fill="#14B8A6">engineered</text>
    </g>
  </g>
</svg>
