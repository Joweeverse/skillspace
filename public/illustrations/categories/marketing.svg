<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="mkt-bg" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="mkt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="mkt-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="mkt-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EA580C" flood-opacity="0.12"/>
    </filter>
    <filter id="mkt-shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="url(#mkt-bg)"/>
  <circle cx="520" cy="80" r="90" fill="#FED7AA" opacity="0.5"/>
  <circle cx="80" cy="380" r="70" fill="#FDBA74" opacity="0.3"/>

  <!-- Megaphone (center-left) -->
  <g transform="translate(60, 120)" filter="url(#mkt-shadow)">
    <!-- Megaphone body -->
    <path d="M 20 90 L 160 30 L 160 150 L 20 110 Z" fill="url(#mkt-orange)" rx="8"/>
    <!-- Megaphone bell -->
    <path d="M 160 30 Q 230 60 230 90 Q 230 120 160 150 Z" fill="#FB923C"/>
    <!-- Handle -->
    <rect x="0" y="88" width="22" height="24" rx="6" fill="#C2410C"/>
    <!-- Sound waves -->
    <path d="M 240 60 Q 265 90 240 120" stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 255 48 Q 290 90 255 132" stroke="#FB923C" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 270 36 Q 315 90 270 144" stroke="#FED7AA" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Floating social stat cards -->
  <!-- Card 1: Followers -->
  <g transform="translate(320, 55)" filter="url(#mkt-shadow-sm)">
    <rect width="200" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="38" cy="36" r="22" fill="#FFF7ED"/>
    <text x="38" y="42" font-family="sans-serif" font-size="20" text-anchor="middle">📢</text>
    <text x="72" y="28" font-family="sans-serif" font-size="11" fill="#94A3B8" font-weight="600">Total Reach</text>
    <text x="72" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0F172A">48.2K</text>
    <text x="150" y="30" font-family="sans-serif" font-size="10" fill="#10B981" font-weight="bold">↑ 12%</text>
  </g>

  <!-- Card 2: Engagement -->
  <g transform="translate(340, 148)" filter="url(#mkt-shadow-sm)">
    <rect width="220" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="38" cy="36" r="22" fill="#FFF1F2"/>
    <text x="38" y="42" font-family="sans-serif" font-size="20" text-anchor="middle">❤️</text>
    <text x="72" y="28" font-family="sans-serif" font-size="11" fill="#94A3B8" font-weight="600">Engagement</text>
    <text x="72" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0F172A">8.7%</text>
    <text x="170" y="30" font-family="sans-serif" font-size="10" fill="#10B981" font-weight="bold">↑ 3.2%</text>
  </g>

  <!-- Card 3: Clicks -->
  <g transform="translate(320, 242)" filter="url(#mkt-shadow-sm)">
    <rect width="200" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="38" cy="36" r="22" fill="#EFF6FF"/>
    <text x="38" y="42" font-family="sans-serif" font-size="20" text-anchor="middle">🔗</text>
    <text x="72" y="28" font-family="sans-serif" font-size="11" fill="#94A3B8" font-weight="600">Link Clicks</text>
    <text x="72" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0F172A">3,841</text>
    <text x="160" y="30" font-family="sans-serif" font-size="10" fill="#F97316" font-weight="bold">↑ 7%</text>
  </g>

  <!-- Growth chart at bottom -->
  <g transform="translate(60, 310)" filter="url(#mkt-shadow-sm)">
    <rect width="490" height="110" rx="20" fill="#FFFFFF"/>
    <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">Campaign Performance</text>
    <!-- Chart line -->
    <polyline points="30,85 90,70 150,75 210,55 270,60 330,40 390,30 450,22" stroke="url(#mkt-orange)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Area fill -->
    <path d="M 30 85 L 90 70 L 150 75 L 210 55 L 270 60 L 330 40 L 390 30 L 450 22 L 450 90 L 30 90 Z" fill="#FB923C" opacity="0.08"/>
    <!-- Dots on line -->
    <circle cx="210" cy="55" r="5" fill="#EA580C"/>
    <circle cx="330" cy="40" r="5" fill="#EA580C"/>
    <circle cx="450" cy="22" r="6" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
