<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bookCoverL" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bookCoverR" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="bookShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1D4ED8" flood-opacity="0.2"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>

  <!-- Background blobs -->
  <circle cx="540" cy="80" r="100" fill="#BFDBFE" opacity="0.4"/>
  <circle cx="60" cy="390" r="80" fill="#DBEAFE" opacity="0.5"/>
  <circle cx="300" cy="420" r="60" fill="#BFDBFE" opacity="0.3"/>

  <!-- Decorative dots -->
  <circle cx="50" cy="80" r="8" fill="#93C5FD" opacity="0.4"/>
  <circle cx="80" cy="110" r="5" fill="#2563EB" opacity="0.3"/>
  <circle cx="540" cy="360" r="7" fill="#3B82F6" opacity="0.4"/>
  <circle cx="560" cy="390" r="4" fill="#2563EB" opacity="0.3"/>

  <!-- === OPEN BOOK === -->
  <g filter="url(#bookShadow)" transform="translate(300, 240)">
    <!-- Book spine shadow -->
    <rect x="-6" y="-120" width="12" height="180" rx="4" fill="#1D4ED8"/>

    <!-- Left page (cover) -->
    <path d="M 0 -120 L -180 -100 L -180 60 L 0 60 Z" fill="url(#bookCoverL)" rx="8"/>
    <!-- Left page texture lines -->
    <line x1="-20" y1="-80" x2="-160" y2="-68" stroke="white" stroke-width="2" opacity="0.2"/>
    <line x1="-20" y1="-60" x2="-160" y2="-50" stroke="white" stroke-width="1.5" opacity="0.15"/>
    <line x1="-20" y1="-42" x2="-140" y2="-34" stroke="white" stroke-width="1.5" opacity="0.15"/>
    <line x1="-20" y1="-24" x2="-120" y2="-18" stroke="white" stroke-width="1.5" opacity="0.15"/>
    <!-- Book title on left cover -->
    <rect x="-155" y="-110" width="140" height="8" rx="4" fill="white" opacity="0.4"/>
    <rect x="-155" y="-98" width="90" height="6" rx="3" fill="white" opacity="0.25"/>
    <!-- Decorative bookmark -->
    <rect x="-40" y="-120" width="14" height="40" rx="4" fill="#FBBF24"/>
    <path d="M -40 -82 L -33 -75 L -26 -82" fill="#FBBF24"/>

    <!-- Right page (white) -->
    <path d="M 0 -120 L 180 -100 L 180 60 L 0 60 Z" fill="url(#pageGrad)"/>
    <!-- Right page lines (content) -->
    <line x1="20" y1="-80" x2="160" y2="-68" stroke="#BFDBFE" stroke-width="2"/>
    <line x1="20" y1="-60" x2="160" y2="-50" stroke="#DBEAFE" stroke-width="1.5"/>
    <line x1="20" y1="-40" x2="140" y2="-33" stroke="#DBEAFE" stroke-width="1.5"/>
    <line x1="20" y1="-22" x2="150" y2="-16" stroke="#DBEAFE" stroke-width="1.5"/>
    <line x1="20" y1="-4" x2="120" y2="2" stroke="#DBEAFE" stroke-width="1.5"/>
    <line x1="20" y1="14" x2="140" y2="19" stroke="#DBEAFE" stroke-width="1.5"/>
    <!-- Right page: mini chart -->
    <rect x="20" y="28" width="12" height="20" rx="3" fill="#2563EB" opacity="0.5"/>
    <rect x="38" y="20" width="12" height="28" rx="3" fill="#3B82F6" opacity="0.5"/>
    <rect x="56" y="14" width="12" height="34" rx="3" fill="#1D4ED8" opacity="0.5"/>
    <rect x="74" y="24" width="12" height="24" rx="3" fill="#2563EB" opacity="0.4"/>

    <!-- Page curl bottom-right -->
    <path d="M 170 54 Q 180 60 175 70 Q 160 65 155 55 Z" fill="#DBEAFE" opacity="0.6"/>
  </g>

  <!-- === SPARKLES / STARS floating around book === -->
  <!-- Large star top-right of book -->
  <g filter="url(#glowFilter)">
    <text x="430" y="120" font-size="36" fill="#FBBF24" opacity="0.9">✦</text>
  </g>
  <text x="400" y="100" font-size="20" fill="#93C5FD" opacity="0.7">✦</text>
  <text x="460" y="150" font-size="14" fill="#A78BFA" opacity="0.6">✦</text>

  <!-- Left side sparkles -->
  <text x="110" y="150" font-size="28" fill="#FBBF24" opacity="0.8">★</text>
  <text x="90" y="190" font-size="16" fill="#3B82F6" opacity="0.5">✦</text>
  <text x="140" y="120" font-size="12" fill="#A78BFA" opacity="0.5">✦</text>

  <!-- Bottom sparkles -->
  <text x="260" y="380" font-size="18" fill="#FBBF24" opacity="0.6">✦</text>
  <text x="340" y="400" font-size="12" fill="#93C5FD" opacity="0.5">★</text>

  <!-- Orbiting dots -->
  <circle cx="430" cy="230" r="10" fill="#FBBF24" opacity="0.7"/>
  <circle cx="450" cy="260" r="6" fill="#FDE68A" opacity="0.5"/>
  <circle cx="160" cy="270" r="8" fill="#93C5FD" opacity="0.6"/>
  <circle cx="140" cy="250" r="5" fill="#BFDBFE" opacity="0.5"/>

  <!-- Label banner -->
  <rect x="200" y="380" width="200" height="38" rx="19" fill="#2563EB" opacity="0.9"/>
  <text x="300" y="404" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Start Learning Today</text>
</svg>
