<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>
    <filter id="sh-sm" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
    <filter id="blur-bg">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="600" height="450" rx="20" fill="url(#bg-grad)"/>

  <!-- ══ DESKTOP SCREEN (main browser) ══════════════════════════════ -->
  <g filter="url(#sh)">
    <!-- Screen bezel -->
    <rect x="22" y="20" width="430" height="288" rx="12" fill="#1E293B"/>
    <!-- Screen face -->
    <rect x="30" y="28" width="414" height="272" rx="8" fill="#F8FAFC"/>

    <!-- Browser chrome -->
    <rect x="30" y="28" width="414" height="36" rx="8" fill="#E2E8F0"/>
    <rect x="30" y="52" width="414" height="12" fill="#E2E8F0"/>

    <!-- Traffic lights -->
    <circle cx="50" cy="46" r="5.5" fill="#EF4444"/>
    <circle cx="66" cy="46" r="5.5" fill="#F59E0B"/>
    <circle cx="82" cy="46" r="5.5" fill="#22C55E"/>

    <!-- URL bar -->
    <rect x="100" y="38" width="220" height="18" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="210" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">youtube.com/watch?v=xK9j2…</text>
    <!-- Reload icon -->
    <text x="330" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">⟳</text>

    <!-- ── BROWSER TABS ──────────────────────── -->
    <!-- Active tab: YouTube -->
    <rect x="30" y="64" width="104" height="24" rx="5" fill="#FFFFFF"/>
    <rect x="30" y="80" width="104" height="8" fill="#FFFFFF"/>
    <!-- YT logo mini -->
    <rect x="38" y="71" width="12" height="9" rx="2" fill="#EF4444"/>
    <polygon points="42,73.5 48,75.5 42,77.5" fill="#FFFFFF"/>
    <text x="54" y="79" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#0F172A">YouTube</text>
    <!-- Close btn -->
    <text x="122" y="79" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">✕</text>

    <!-- Tab 2: Quizlet -->
    <rect x="136" y="67" width="92" height="21" rx="5" fill="#D1D5DB"/>
    <rect x="136" y="80" width="92" height="8" fill="#D1D5DB"/>
    <circle cx="145" cy="77.5" r="5" fill="#4D6CC5"/>
    <text x="153" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#374151">Quizlet</text>

    <!-- Tab 3: Discord -->
    <rect x="230" y="67" width="92" height="21" rx="5" fill="#D1D5DB"/>
    <rect x="230" y="80" width="92" height="8" fill="#D1D5DB"/>
    <circle cx="239" cy="77.5" r="5" fill="#5865F2"/>
    <text x="247" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#374151">Discord</text>

    <!-- Tab 4: Notion -->
    <rect x="324" y="67" width="88" height="21" rx="5" fill="#D1D5DB"/>
    <rect x="324" y="80" width="88" height="8" fill="#D1D5DB"/>
    <rect x="332" y="72" width="8" height="10" rx="1" fill="#000000"/>
    <text x="344" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#374151">Notion</text>

    <!-- + tab -->
    <circle cx="423" cy="77" r="8" fill="#CBD5E1"/>
    <text x="423" y="81" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">+</text>

    <!-- ── YOUTUBE CONTENT AREA ─────────────── -->
    <!-- Video player black area -->
    <rect x="30" y="88" width="274" height="150" fill="#111827"/>
    <!-- Video thumbnail dark overlay grid suggesting freeze frame -->
    <rect x="30" y="88" width="274" height="150" fill="#1E293B"/>
    <!-- Play button (paused) -->
    <circle cx="167" cy="163" r="22" fill="#000000" fill-opacity="0.55"/>
    <polygon points="160,153 160,173 180,163" fill="#FFFFFF"/>
    <!-- Progress bar -->
    <rect x="30" y="236" width="274" height="5" fill="#374151"/>
    <rect x="30" y="236" width="120" height="5" fill="#EF4444"/>
    <!-- Playhead dot -->
    <circle cx="150" cy="238.5" r="4.5" fill="#EF4444"/>
    <!-- Bottom controls -->
    <rect x="30" y="241" width="274" height="22" fill="#0F172A"/>
    <polygon points="38,249 44,252 38,255" fill="#FFFFFF"/>
    <text x="50" y="255" font-family="monospace" font-size="8" fill="#9CA3AF">7:14 / 22:40</text>
    <text x="258" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">⛶</text>

    <!-- ── SIDEBAR: Chat / Comments ────────── -->
    <rect x="306" y="88" width="138" height="175" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Sidebar header -->
    <rect x="306" y="88" width="138" height="26" fill="#5865F2"/>
    <text x="315" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF"># react-help</text>
    <!-- Unread badge -->
    <circle cx="430" cy="101" r="8" fill="#EF4444"/>
    <text x="430" y="105" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- Chat messages -->
    <circle cx="316" cy="128" r="8" fill="#8B5CF6"/>
    <text x="316" y="132" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
    <rect x="328" y="121" width="88" height="7" rx="3" fill="#E2E8F0"/>
    <rect x="328" y="131" width="68" height="7" rx="3" fill="#F1F5F9"/>

    <circle cx="316" cy="152" r="8" fill="#F59E0B"/>
    <text x="316" y="156" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
    <rect x="328" y="145" width="76" height="7" rx="3" fill="#E2E8F0"/>
    <rect x="328" y="155" width="94" height="7" rx="3" fill="#F1F5F9"/>

    <circle cx="316" cy="176" r="8" fill="#EF4444"/>
    <text x="316" y="180" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
    <rect x="328" y="169" width="84" height="7" rx="3" fill="#E2E8F0"/>
    <rect x="328" y="179" width="60" height="7" rx="3" fill="#F1F5F9"/>

    <!-- Chat input -->
    <rect x="310" y="246" width="130" height="14" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="317" y="256" font-family="system-ui, sans-serif" font-size="7.5" fill="#94A3B8">Ask a question…</text>

    <!-- Bottom status bar -->
    <rect x="30" y="263" width="414" height="17" rx="0" fill="#F1F5F9"/>
    <text x="38" y="275" font-family="system-ui, sans-serif" font-size="8" fill="#64748B">🔴 Live  |  1,204 watching</text>
    <text x="250" y="275" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">Switch to Quizlet →</text>

    <!-- Laptop base -->
    <rect x="22" y="308" width="430" height="10" rx="5" fill="#1E293B"/>
    <rect x="162" y="314" width="150" height="6" rx="3" fill="#0F172A"/>
  </g>

  <!-- ══ FLOATING NOTIFICATION CARDS ════════════════════════════════ -->

  <!-- Notif 1: Quizlet deadline (top right) -->
  <g transform="translate(385, 14)" filter="url(#sh-sm)">
    <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
    <!-- red strip -->
    <rect width="168" height="52" rx="12" fill="#FFF1F2"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#EF4444"/>
    <circle cx="22" cy="26" r="12" fill="#FEE2E2"/>
    <text x="22" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">⏰</text>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#991B1B">Quizlet Reminder</text>
    <text x="40" y="33" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">Quiz deadline in 45 min!</text>
    <text x="40" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">Open Quizlet →</text>
    <text x="154" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">✕</text>
  </g>

  <!-- Notif 2: Discord unread (left) -->
  <g transform="translate(4, 100)" filter="url(#sh-sm)">
    <rect width="152" height="52" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#5865F2"/>
    <circle cx="22" cy="26" r="12" fill="#EEF2FF"/>
    <text x="22" y="31" font-family="system-ui, sans-serif" font-size="14" fill="#5865F2" text-anchor="middle">💬</text>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#3730A3">Discord</text>
    <text x="40" y="33" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">5 unread in #react-help</text>
    <text x="40" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">Open Discord →</text>
  </g>

  <!-- Notif 3: Notion (bottom left) -->
  <g transform="translate(4, 268)" filter="url(#sh-sm)">
    <rect width="152" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#374151"/>
    <circle cx="22" cy="26" r="12" fill="#F9FAFB"/>
    <rect x="15" y="18" width="14" height="16" rx="2" fill="#111827"/>
    <text x="22" y="30" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#111827">Notion</text>
    <text x="40" y="33" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">New notes shared</text>
    <text x="40" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">Go to Notion →</text>
  </g>

  <!-- ══ FRUSTRATED PERSON ═══════════════════════════════════════════ -->
  <g transform="translate(460, 240)">
    <!-- Shadow ellipse -->
    <ellipse cx="56" cy="118" rx="42" ry="8" fill="#E2E8F0"/>

    <!-- Body / torso - blue shirt -->
    <path d="M 20 80 Q 56 100 92 80 L 100 118 Q 56 130 12 118 Z" fill="#3B82F6"/>
    <!-- Collar -->
    <path d="M 42 72 L 56 80 L 70 72" fill="#2563EB"/>

    <!-- Neck -->
    <rect x="47" y="62" width="18" height="14" rx="4" fill="#FBBF24"/>

    <!-- Head -->
    <ellipse cx="56" cy="48" rx="24" ry="23" fill="#FBBF24"/>

    <!-- Hair (messy / stressed look) -->
    <path d="M 32 38 Q 56 12 80 38 Q 78 24 72 20 Q 56 10 40 20 Q 34 24 32 38 Z" fill="#78350F"/>
    <!-- Messy hair strands -->
    <path d="M 36 30 Q 30 20 38 15" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 56 24 Q 54 12 60 10" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 76 30 Q 82 20 74 15" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Eyes (wide / stressed) -->
    <ellipse cx="45" cy="47" rx="5" ry="6" fill="#FFFFFF"/>
    <circle cx="45" cy="49" r="3.5" fill="#1E293B"/>
    <circle cx="43.5" cy="47.5" r="1" fill="#FFFFFF"/>

    <ellipse cx="67" cy="47" rx="5" ry="6" fill="#FFFFFF"/>
    <circle cx="67" cy="49" r="3.5" fill="#1E293B"/>
    <circle cx="65.5" cy="47.5" r="1" fill="#FFFFFF"/>

    <!-- Stressed eyebrows (angled inward) -->
    <path d="M 40 39 Q 44 36 49 38" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 63 38 Q 68 36 72 39" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Mouth (open/frown stressed) -->
    <path d="M 46 60 Q 56 55 66 60" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Sweat drops -->
    <ellipse cx="84" cy="36" rx="3.5" ry="5.5" fill="#BAE6FD"/>
    <path d="M 84 30.5 L 87.5 36 L 80.5 36 Z" fill="#BAE6FD"/>
    <ellipse cx="92" cy="50" rx="2.5" ry="4" fill="#BAE6FD"/>
    <path d="M 92 46 L 94.5 50 L 89.5 50 Z" fill="#BAE6FD"/>

    <!-- Left arm (pointing at screen) -->
    <path d="M 20 90 Q 2 76 8 60" stroke="#FBBF24" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Hand pointing -->
    <circle cx="8" cy="58" r="6" fill="#FBBF24"/>
    <path d="M 2 54 Q 1 48 6 46" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Right arm (scratching head) -->
    <path d="M 92 90 Q 108 72 96 50" stroke="#FBBF24" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="48" r="6" fill="#FBBF24"/>
  </g>

  <!-- ══ CHAOS ARROWS (tab-switching) ════════════════════════════════ -->
  <!-- Arrow curve: YouTube tab → Quizlet tab -->
  <path d="M 88 65 C 88 50, 160 50, 160 67" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 3.5" fill="none" stroke-linecap="round"/>
  <polygon points="156,63 160,72 164,63" fill="#EF4444"/>

  <!-- Arrow curve: Quizlet → Discord -->
  <path d="M 182 65 C 182 50, 258 50, 258 67" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 3.5" fill="none" stroke-linecap="round"/>
  <polygon points="254,63 258,72 262,63" fill="#8B5CF6"/>

  <!-- Arrow curve: Discord → Notion -->
  <path d="M 276 65 C 276 50, 352 50, 352 67" stroke="#374151" stroke-width="2" stroke-dasharray="5 3.5" fill="none" stroke-linecap="round"/>
  <polygon points="348,63 352,72 356,63" fill="#374151"/>

  <!-- ══ FLOATING QUESTION MARKS ═══════════════════════════════════= -->
  <text x="510" y="232" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#EF4444" fill-opacity="0.55">?</text>
  <text x="490" y="210" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#F59E0B" fill-opacity="0.5">?</text>
  <text x="535" y="260" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#8B5CF6" fill-opacity="0.45">?</text>

  <!-- ══ CAPTION LABEL ════════════════════════════════════════════════ -->
  <rect x="22" y="332" width="430" height="28" rx="8" fill="#FEE2E2"/>
  <text x="237" y="350" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">
    4 apps open · 5 unread notifications · 0% focus
  </text>
</svg>
