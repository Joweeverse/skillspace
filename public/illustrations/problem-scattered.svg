<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="scattered-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#scattered-bg)"/>

  <!-- Disconnected/Tangled Dashed Connector Lines -->
  <path d="M 180 180 C 260 260, 320 120, 420 190" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <path d="M 230 330 C 310 270, 360 380, 420 310" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <!-- Warning / Confusion Icons -->
  <circle cx="300" cy="220" r="16" fill="#FEE2E2"/>
  <text x="300" y="225" font-family="sans-serif" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">?</text>

  <!-- Card 1: Video App (Top Left, tilted) -->
  <g transform="translate(60, 60) rotate(-6)" filter="url(#card-shadow)">
    <rect width="210" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="210" height="32" rx="16" fill="#EF4444"/>
    <rect y="16" width="210" height="16" fill="#EF4444"/>
    <circle cx="20" cy="16" r="4" fill="#FFFFFF" opacity="0.7"/>
    <text x="36" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Video App</text>
    <!-- Video Player content -->
    <rect x="20" y="48" width="170" height="80" rx="8" fill="#FEE2E2"/>
    <polygon points="95,78 115,88 95,98" fill="#EF4444"/>
  </g>

  <!-- Card 2: Quiz Tool (Top Right, tilted) -->
  <g transform="translate(330, 80) rotate(8)" filter="url(#card-shadow)">
    <rect width="200" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="200" height="32" rx="16" fill="#8B5CF6"/>
    <rect y="16" width="200" height="16" fill="#8B5CF6"/>
    <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Quiz Service</text>
    <!-- Quiz list mockup -->
    <rect x="20" y="48" width="16" height="16" rx="4" fill="#DDD6FE"/>
    <rect x="44" y="52" width="120" height="8" rx="4" fill="#94A3B8"/>
    <rect x="20" y="74" width="16" height="16" rx="4" fill="#DDD6FE"/>
    <rect x="44" y="78" width="100" height="8" rx="4" fill="#94A3B8"/>
    <rect x="20" y="100" width="16" height="16" rx="4" fill="#DDD6FE"/>
    <rect x="44" y="104" width="130" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Card 3: Chat Tool (Bottom Center, tilted) -->
  <g transform="translate(190, 240) rotate(-4)" filter="url(#card-shadow)">
    <rect width="220" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="220" height="32" rx="16" fill="#10B981"/>
    <rect y="16" width="220" height="16" fill="#10B981"/>
    <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Chat & Messaging</text>
    <!-- Chat Bubbles -->
    <rect x="16" y="46" width="130" height="28" rx="12" fill="#D1FAE5"/>
    <rect x="28" y="56" width="90" height="8" rx="4" fill="#047857"/>
    <rect x="74" y="84" width="130" height="28" rx="12" fill="#E2E8F0"/>
    <rect x="86" y="94" width="90" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
