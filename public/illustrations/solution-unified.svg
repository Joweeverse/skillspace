<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="unified-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="primary-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#unified-bg)"/>

  <!-- Unified Main Skillspace Dashboard Card -->
  <g transform="translate(45, 45)" filter="url(#glow-shadow)">
    <rect width="510" height="360" rx="20" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <!-- Top Bar -->
    <rect width="510" height="48" rx="20" fill="url(#primary-blue)"/>
    <rect y="24" width="510" height="24" fill="#1D4ED8"/>
    <circle cx="28" cy="24" r="5" fill="#EF4444"/>
    <circle cx="44" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="24" r="5" fill="#10B981"/>
    <text x="80" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">SkillSpace Unified Platform</text>
    <rect x="360" y="16" width="125" height="22" rx="11" fill="#FFFFFF" opacity="0.25"/>
    <text x="422" y="31" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Integrated Workspace</text>

    <!-- Content Columns -->
    <!-- Column 1: Video Module -->
    <rect x="24" y="68" width="220" height="150" rx="12" fill="#DBEAFE"/>
    <polygon points="120,128 148,143 120,158" fill="#1D4ED8"/>
    <rect x="24" y="228" width="140" height="10" rx="5" fill="#0F172A"/>
    <rect x="24" y="244" width="180" height="8" rx="4" fill="#64748B"/>

    <!-- Column 2: Quiz Module -->
    <rect x="264" y="68" width="220" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="280" y="92" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">Interactive Quiz</text>
    <!-- Checkmark item 1 -->
    <circle cx="288" cy="116" r="10" fill="#10B981"/>
    <path d="M 284 116 L 287 119 L 293 113" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="306" y="112" width="150" height="8" rx="4" fill="#334155"/>
    <!-- Checkmark item 2 -->
    <circle cx="288" cy="144" r="10" fill="#3B82F6"/>
    <path d="M 284 144 L 287 147 L 293 141" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="306" y="140" width="130" height="8" rx="4" fill="#64748B"/>

    <!-- Column 3: Mentor Discussion Module -->
    <rect x="264" y="200" width="220" height="135" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="280" y="222" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369A1">Mentor Discussion</text>
    <rect x="280" y="234" width="140" height="24" rx="10" fill="#E0F2FE"/>
    <rect x="290" y="242" width="100" height="7" rx="3.5" fill="#0284C7"/>
    <rect x="320" y="266" width="150" height="24" rx="10" fill="#2563EB"/>
    <rect x="330" y="274" width="110" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="280" y="298" width="180" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="294" y="314" font-family="sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Ask mentor a question...</text>
  </g>

  <!-- Glowing Check Badge overlay (Bottom Right) -->
  <g transform="translate(480, 360)">
    <circle cx="24" cy="24" r="28" fill="#10B981" filter="url(#glow-shadow)"/>
    <path d="M 12 24 L 20 32 L 36 16" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
