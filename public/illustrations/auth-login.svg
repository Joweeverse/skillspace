<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- Background gradient & circle -->
  <circle cx="250" cy="140" r="120" fill="#EFF6FF" opacity="0.7"/>

  <!-- Portal / Doorway to knowledge -->
  <rect x="180" y="50" width="140" height="190" rx="16" fill="white" stroke="#BFDBFE" stroke-width="3"/>
  <rect x="194" y="66" width="112" height="162" rx="10" fill="#DBEAFE" opacity="0.6"/>

  <!-- Interior light beams -->
  <polygon points="250,90 210,210 290,210" fill="#93C5FD" opacity="0.5"/>

  <!-- Key & Lock floating symbol -->
  <circle cx="250" cy="115" r="24" fill="#2563EB" opacity="0.15"/>
  <rect x="238" y="125" width="24" height="20" rx="6" fill="#2563EB"/>
  <path d="M243 125 V117 C243 113.1 246.1 110 250 110 C253.9 110 257 113.1 257 117 V125" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="250" cy="133" r="3" fill="white"/>

  <!-- Student silhouette stepping in -->
  <circle cx="140" cy="130" r="22" fill="#FBBF24"/>
  <rect x="122" y="156" width="36" height="54" rx="14" fill="#2563EB"/>
  <path d="M148 168 Q175 160 190 150" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Books stack on right -->
  <rect x="330" y="190" width="48" height="12" rx="3" fill="#3B82F6"/>
  <rect x="326" y="204" width="56" height="12" rx="3" fill="#1D4ED8"/>
  <rect x="334" y="176" width="40" height="12" rx="3" fill="#60A5FA"/>

  <!-- Sparkles -->
  <text x="110" y="80" font-size="16" fill="#93C5FD">✦</text>
  <text x="380" y="90" font-size="14" fill="#FBBF24">✦</text>
  <text x="360" y="150" font-size="10" fill="#60A5FA">✦</text>
  <text x="150" y="230" font-size="12" fill="#DBEAFE">✦</text>
</svg>
