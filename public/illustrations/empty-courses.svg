<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <circle cx="200" cy="150" r="130" fill="#F0F9FF" opacity="0.5"/>

  <!-- Empty grid cards (outline only) -->
  <rect x="60" y="100" width="90" height="120" rx="12" fill="none" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="166" y="100" width="90" height="120" rx="12" fill="none" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="272" y="100" width="90" height="120" rx="12" fill="none" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Plus icon in center card -->
  <circle cx="211" cy="160" r="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <line x1="211" y1="148" x2="211" y2="172" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="199" y1="160" x2="223" y2="160" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

  <!-- Rocket launching (mentor creates course) -->
  <g transform="translate(300, 60) rotate(30)">
    <rect x="-10" y="-28" width="20" height="36" rx="10" fill="#2563EB"/>
    <polygon points="0,-36 -10,-20 10,-20" fill="#1E40AF"/>
    <rect x="-6" y="8" width="12" height="10" rx="2" fill="#93C5FD"/>
    <!-- Flames -->
    <path d="M-5 18 Q0 28 5 18" fill="#FBBF24"/>
    <path d="M-3 20 Q0 26 3 20" fill="#FDE68A"/>
  </g>

  <!-- Stars -->
  <text x="68" y="94" font-size="12" fill="#93C5FD">✦</text>
  <text x="346" y="230" font-size="10" fill="#BFDBFE">✦</text>
  <text x="90" y="250" font-size="14" fill="#DBEAFE">✦</text>

  <!-- Light rays from center card -->
  <line x1="211" y1="88" x2="211" y2="78" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
  <line x1="235" y1="94" x2="241" y2="86" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
  <line x1="187" y1="94" x2="181" y2="86" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
</svg>
