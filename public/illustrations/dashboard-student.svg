<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" fill="none">
  <!-- Background blobs -->
  <circle cx="480" cy="60" r="90" fill="#EFF6FF" opacity="0.8"/>
  <circle cx="80" cy="260" r="60" fill="#EFF6FF" opacity="0.5"/>

  <!-- Desk -->
  <rect x="80" y="230" width="400" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="140" y="242" width="16" height="40" rx="4" fill="#CBD5E1"/>
  <rect x="404" y="242" width="16" height="40" rx="4" fill="#CBD5E1"/>

  <!-- Laptop body -->
  <rect x="160" y="160" width="200" height="130" rx="12" fill="#1E40AF"/>
  <rect x="168" y="168" width="184" height="114" rx="8" fill="#DBEAFE"/>
  <!-- Screen content - progress bars -->
  <rect x="180" y="182" width="80" height="8" rx="4" fill="#2563EB"/>
  <rect x="180" y="198" width="120" height="8" rx="4" fill="#93C5FD"/>
  <rect x="180" y="214" width="60" height="8" rx="4" fill="#2563EB"/>
  <rect x="180" y="230" width="100" height="8" rx="4" fill="#93C5FD"/>
  <!-- Progress ring on screen -->
  <circle cx="310" cy="210" r="28" stroke="#E0EAFF" stroke-width="6" fill="none"/>
  <circle cx="310" cy="210" r="28" stroke="#2563EB" stroke-width="6" fill="none" stroke-dasharray="110 65" stroke-linecap="round" transform="rotate(-90 310 210)"/>
  <text x="310" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">72%</text>

  <!-- Laptop hinge/base -->
  <rect x="140" y="288" width="240" height="10" rx="5" fill="#1E3A8A"/>

  <!-- Student character (right side) -->
  <!-- Body -->
  <rect x="390" y="168" width="52" height="70" rx="26" fill="#FBBF24"/>
  <!-- Shirt -->
  <rect x="384" y="210" width="64" height="50" rx="16" fill="#2563EB"/>
  <!-- Head -->
  <circle cx="416" cy="150" r="30" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M390 138 Q416 118 442 138" stroke="#92400E" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="406" cy="148" r="4" fill="#1E40AF"/>
  <circle cx="426" cy="148" r="4" fill="#1E40AF"/>
  <!-- Smile -->
  <path d="M408 160 Q416 167 424 160" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Pointing arm toward screen -->
  <path d="M384 228 Q360 218 340 230" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Hand pointing -->
  <circle cx="336" cy="232" r="8" fill="#FBBF24"/>

  <!-- Stars / sparkles -->
  <text x="456" y="130" font-size="18" fill="#FBBF24">✦</text>
  <text x="128" y="170" font-size="14" fill="#93C5FD">✦</text>
  <text x="470" y="210" font-size="10" fill="#2563EB">✦</text>

  <!-- Books stack (left) -->
  <rect x="92" y="208" width="56" height="12" rx="4" fill="#2563EB"/>
  <rect x="96" y="197" width="52" height="12" rx="4" fill="#3B82F6"/>
  <rect x="100" y="187" width="48" height="12" rx="4" fill="#60A5FA"/>
</svg>
