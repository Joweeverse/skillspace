<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="step1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#step1-bg)"/>

  <!-- Search Bar Header -->
  <g transform="translate(60, 45)" filter="url(#shadow-sm)">
    <rect width="480" height="44" rx="22" fill="#FFFFFF"/>
    <circle cx="30" cy="22" r="8" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
    <line x1="36" y1="28" x2="44" y2="36" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="56" y="27" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Search UI/UX, Fullstack, AI, Mobile...</text>

    <!-- Filter Pill tags -->
    <rect x="330" y="8" width="65" height="28" rx="14" fill="#2563EB"/>
    <text x="362.5" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Design</text>
    <rect x="403" y="8" width="65" height="28" rx="14" fill="#DBEAFE"/>
    <text x="435.5" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">Coding</text>
  </g>

  <!-- Course Card 1 (Active / Selected) -->
  <g transform="translate(60, 120)" filter="url(#shadow-sm)">
    <rect width="225" height="260" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <rect width="225" height="120" rx="16" fill="#3B82F6"/>
    <rect y="104" width="225" height="16" fill="#3B82F6"/>
    <!-- Icon/Illustration inside course -->
    <circle cx="112.5" cy="60" r="28" fill="#FFFFFF" opacity="0.2"/>
    <polygon points="102.5,46 127.5,60 102.5,74" fill="#FFFFFF"/>

    <!-- Course Details -->
    <rect x="16" y="136" width="60" height="18" rx="9" fill="#EFF6FF"/>
    <text x="46" y="149" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="middle">Beginner</text>
    <text x="16" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Frontend Masterclass</text>
    <rect x="16" y="188" width="160" height="8" rx="4" fill="#94A3B8"/>
    <rect x="16" y="202" width="120" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Selection indicator -->
    <rect x="16" y="222" width="193" height="26" rx="8" fill="#2563EB"/>
    <text x="112.5" y="239" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Select Path ✓</text>
  </g>

  <!-- Course Card 2 -->
  <g transform="translate(315, 120)" filter="url(#shadow-sm)">
    <rect width="225" height="260" rx="16" fill="#FFFFFF"/>
    <rect width="225" height="120" rx="16" fill="#1E40AF"/>
    <rect y="104" width="225" height="16" fill="#1E40AF"/>
    <circle cx="112.5" cy="60" r="28" fill="#FFFFFF" opacity="0.15"/>
    <rect x="96.5" y="44" width="32" height="32" rx="6" fill="#60A5FA"/>

    <rect x="16" y="136" width="70" height="18" rx="9" fill="#F1F5F9"/>
    <text x="51" y="149" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Advanced</text>
    <text x="16" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Fullstack Next.js 15</text>
    <rect x="16" y="188" width="150" height="8" rx="4" fill="#94A3B8"/>
    <rect x="16" y="202" width="110" height="8" rx="4" fill="#CBD5E1"/>

    <rect x="16" y="222" width="193" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="112.5" y="239" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748B" text-anchor="middle">View Details</text>
  </g>
</svg>
