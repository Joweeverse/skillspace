<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="720" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1E40AF"/>
      <stop offset="50%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Solid gradient background -->
  <rect width="720" height="200" fill="url(#cg)"/>

  <!-- Geometric overlays for depth -->
  <circle cx="650" cy="-20" r="130" fill="white" opacity="0.06"/>
  <circle cx="80"  cy="220" r="110" fill="white" opacity="0.05"/>
  <circle cx="360" cy="100" r="180" fill="white" opacity="0.03"/>

  <!-- Horizontal light line -->
  <line x1="0" y1="130" x2="720" y2="130" stroke="white" stroke-width="0.5" opacity="0.1"/>

  <!-- Dot grid pattern (decorative) -->
  <g opacity="0.08" fill="white">
    <circle cx="60"  cy="40"  r="2"/>
    <circle cx="100" cy="40"  r="2"/>
    <circle cx="140" cy="40"  r="2"/>
    <circle cx="60"  cy="80"  r="2"/>
    <circle cx="100" cy="80"  r="2"/>
    <circle cx="140" cy="80"  r="2"/>
    <circle cx="60"  cy="120" r="2"/>
    <circle cx="100" cy="120" r="2"/>
    <circle cx="140" cy="120" r="2"/>
    <circle cx="580" cy="40"  r="2"/>
    <circle cx="620" cy="40"  r="2"/>
    <circle cx="660" cy="40"  r="2"/>
    <circle cx="580" cy="80"  r="2"/>
    <circle cx="620" cy="80"  r="2"/>
    <circle cx="660" cy="80"  r="2"/>
  </g>

  <!-- Sparkles -->
  <text x="260" y="50"  font-size="18" fill="white" opacity="0.25">✦</text>
  <text x="460" y="160" font-size="14" fill="white" opacity="0.2">✦</text>
  <text x="640" cy="130" font-size="12" fill="white" opacity="0.15">✦</text>
</svg>
