<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- Background circle -->
  <circle cx="250" cy="140" r="120" fill="#EFF6FF" opacity="0.8"/>

  <!-- Shield in center -->
  <path d="M250 56 L310 82 V142 C310 182 250 216 250 216 C250 216 190 182 190 142 V82 Z" fill="white" stroke="#BFDBFE" stroke-width="3"/>
  <path d="M250 68 L298 90 V138 C298 170 250 200 250 200 C250 200 202 170 202 138 V90 Z" fill="#DBEAFE" opacity="0.6"/>

  <!-- Padlock in shield -->
  <rect x="230" y="126" width="40" height="34" rx="8" fill="#2563EB"/>
  <path d="M238 126 V112 C238 105.4 243.4 100 250 100 C256.6 100 262 105.4 262 112 V126" stroke="#2563EB" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="250" cy="140" r="4" fill="white"/>
  <path d="M250 144 V150" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden key floating to the left -->
  <g transform="translate(140, 110) rotate(-30)">
    <circle cx="20" cy="20" r="14" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="6" fill="white"/>
    <rect x="32" y="17" width="28" height="6" rx="2" fill="#FBBF24"/>
    <rect x="50" y="23" width="6" height="8" rx="1.5" fill="#FBBF24"/>
    <rect x="42" y="23" width="5" height="5" rx="1.5" fill="#FBBF24"/>
  </g>

  <!-- Sparkles -->
  <text x="340" y="90" font-size="16" fill="#FBBF24">✦</text>
  <text x="120" y="80" font-size="14" fill="#60A5FA">✦</text>
  <text x="350" y="170" font-size="12" fill="#93C5FD">✦</text>
  <text x="150" y="210" font-size="12" fill="#FBBF24">✦</text>
</svg>
