<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glassShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.2"/>
    </filter>
    <filter id="charShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#94A3B8" flood-opacity="0.2"/>
    </filter>
    <clipPath id="glassClip">
      <circle cx="210" cy="175" r="90"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgGrad)"/>

  <!-- Soft background blobs -->
  <circle cx="430" cy="60" r="80" fill="#EFF6FF" opacity="0.6"/>
  <circle cx="60" cy="340" r="60" fill="#E0F2FE" opacity="0.5"/>
  <circle cx="460" cy="360" r="40" fill="#DBEAFE" opacity="0.4"/>

  <!-- === CHARACTER === -->
  <g filter="url(#charShadow)">
    <!-- Body -->
    <rect x="195" y="265" width="80" height="90" rx="22" fill="#3B82F6"/>
    <!-- Collar detail -->
    <path d="M 222 265 Q 235 278 248 265" stroke="white" stroke-width="2" fill="none"/>

    <!-- Left arm - holding magnifying glass -->
    <rect x="140" y="265" width="62" height="22" rx="11" fill="#3B82F6" transform="rotate(-35, 170, 270)"/>
    <ellipse cx="118" cy="285" rx="14" ry="11" fill="#FDE68A" transform="rotate(-35,118,285)"/>

    <!-- Right arm - up/curious gesture -->
    <rect x="275" y="262" width="55" height="20" rx="10" fill="#3B82F6" transform="rotate(30, 302, 270)"/>
    <ellipse cx="324" cy="295" rx="13" ry="11" fill="#FDE68A" transform="rotate(30,324,295)"/>

    <!-- Neck -->
    <rect x="222" y="246" width="24" height="24" rx="9" fill="#FDE68A"/>

    <!-- Head -->
    <ellipse cx="234" cy="218" rx="48" ry="50" fill="#FDE68A"/>

    <!-- Hair -->
    <path d="M 188 206 Q 196 158 234 164 Q 272 158 280 206 Q 266 180 234 183 Q 202 180 188 206 Z" fill="#1F2937"/>
    <!-- Ear -->
    <ellipse cx="186" cy="218" rx="8" ry="11" fill="#FDE68A"/>
    <ellipse cx="282" cy="218" rx="8" ry="11" fill="#FDE68A"/>

    <!-- Eyes - wide/curious looking toward glass -->
    <ellipse cx="218" cy="215" rx="10" ry="11" fill="white"/>
    <ellipse cx="250" cy="215" rx="10" ry="11" fill="white"/>
    <!-- Pupils shifted toward the glass (left) -->
    <circle cx="215" cy="216" r="6" fill="#1F2937"/>
    <circle cx="247" cy="216" r="6" fill="#1F2937"/>
    <!-- Eye shine -->
    <circle cx="213" cy="213" r="2.5" fill="white"/>
    <circle cx="245" cy="213" r="2.5" fill="white"/>

    <!-- Curious raised eyebrows -->
    <path d="M 207 201 Q 218 196 229 201" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 240 199 Q 251 193 262 199" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="234" cy="226" rx="4" ry="3" fill="#F59E0B" opacity="0.5"/>

    <!-- Curious/open mouth (small O) -->
    <ellipse cx="234" cy="238" rx="8" ry="6" fill="#92400E" opacity="0.6"/>
    <ellipse cx="234" cy="238" rx="6" ry="4" fill="#FCA5A5" opacity="0.5"/>

    <!-- Cheeks -->
    <ellipse cx="202" cy="232" rx="12" ry="8" fill="#FCA5A5" opacity="0.35"/>
    <ellipse cx="266" cy="232" rx="12" ry="8" fill="#FCA5A5" opacity="0.35"/>

    <!-- Legs -->
    <rect x="203" y="350" width="28" height="40" rx="14" fill="#374151"/>
    <rect x="239" y="350" width="28" height="40" rx="14" fill="#374151"/>
    <!-- Shoes -->
    <ellipse cx="217" cy="387" rx="18" ry="10" fill="#1F2937"/>
    <ellipse cx="253" cy="387" rx="18" ry="10" fill="#1F2937"/>
  </g>

  <!-- === MAGNIFYING GLASS === -->
  <g filter="url(#glassShadow)">
    <!-- Glass rim (outer circle) -->
    <circle cx="210" cy="175" r="90" fill="none" stroke="#2563EB" stroke-width="14"/>
    <!-- Glass fill -->
    <circle cx="210" cy="175" r="82" fill="url(#glassGrad)"/>
    <!-- Glass shine -->
    <ellipse cx="188" cy="150" rx="22" ry="14" fill="white" opacity="0.35" transform="rotate(-20,188,150)"/>

    <!-- Inside the glass: question mark (not sad, just empty/curious) -->
    <text x="210" y="195" font-family="Arial,sans-serif" font-size="80" font-weight="900" fill="#2563EB" opacity="0.25" text-anchor="middle">?</text>
    <text x="210" y="195" font-family="Arial,sans-serif" font-size="72" font-weight="900" fill="#2563EB" opacity="0.5" text-anchor="middle">?</text>

    <!-- Tiny sparkles inside glass -->
    <circle cx="175" cy="145" r="4" fill="#93C5FD" opacity="0.6"/>
    <circle cx="245" cy="150" r="3" fill="#60A5FA" opacity="0.5"/>
    <circle cx="180" cy="210" r="3" fill="#BFDBFE" opacity="0.7"/>

    <!-- Handle -->
    <rect x="276" y="237" width="90" height="20" rx="10" fill="url(#handleGrad)" transform="rotate(45, 320, 247)"/>
  </g>

  <!-- Floating dots/sparkles -->
  <circle cx="100" cy="100" r="7" fill="#93C5FD" opacity="0.5"/>
  <circle cx="130" cy="70" r="4" fill="#3B82F6" opacity="0.4"/>
  <circle cx="380" cy="120" r="6" fill="#93C5FD" opacity="0.4"/>
  <circle cx="410" cy="90" r="4" fill="#2563EB" opacity="0.3"/>

  <!-- Star sparkles -->
  <text x="80" y="150" font-size="18" fill="#FBBF24" opacity="0.7">✦</text>
  <text x="385" y="210" font-size="14" fill="#A78BFA" opacity="0.6">✦</text>
  <text x="355" y="310" font-size="10" fill="#93C5FD" opacity="0.6">✦</text>
  <text x="110" y="310" font-size="12" fill="#FBBF24" opacity="0.5">★</text>
</svg>
